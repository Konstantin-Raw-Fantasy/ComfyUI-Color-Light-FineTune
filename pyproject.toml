[project]
name = "color-light-finetune"
description = "Color & light grading node for ComfyUI with a built-in live preview, color wheels, per-zone color balance, tone curves, film grain and picked-color adjustments; works with images and videos (frame batches)."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
]

